<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Lớp Đăng nhập -->
    <div id="login-layer" class="page">
        <h1>Ritco</h1>
        <button onclick="login('Google')">Google</button>
        <button onclick="login('Apple')">Apple</button>
        <button onclick="login('Phone')">Số điện thoại</button>
        <button onclick="showCreateName()">Sign in</button>
    </div>

    <!-- Lớp Tạo Tên -->
    <div id="create-name-layer" class="page" style="display:none;">
        <input type="text" id="username" placeholder="Tên:">
        <button onclick="finishSetup()">Sign in</button>
    </div>

    <!-- Lớp Dashboard -->
    <div id="dashboard-layer" class="page" style="display:none;">
        <h2>Ritco</h2>
        <button onclick="location.href='editor.html'">Make Game</button>
        <div id="notification">Kết bạn mới vui</div>
        <div id="game-list"></div>
    </div>
    <script src="main.js"></script>
</body>
</html>
